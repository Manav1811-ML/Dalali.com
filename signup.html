<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
          <a href="index.html" class="logo"><h1 class="motion">Dalali.com<span></span></h1></a>
          <div class="menu" id="nav-links">
            <a href="Buyers.html">For Buyers</a>
            <a href="Owners.html">For Owners</a>
            <a href="properties.html">Properties</a>
            <a href="login.html" class="pill">Login / Register</a>
          </div>
          <div class="nav-actions">
            <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-sun"></i></button>
            <button id="menu-bars" class="icon-btn" aria-label="Open menu"><i class="fas fa-bars"></i></button>
          </div>
        </nav>
      </header>

    <div class="auth-shell">
        <div class="auth-card">
            <form name="myForm" onsubmit="return validateForm()" aciton="Signup.php" method="post">
                <h2 id="heading">Signup</h2>
                <div class="input-main">
                    <div class="input">
                        <label for="FullName" class="label">Full name</label>
                        <div class="input_class" id="input_name">
                            <input type="name" name="fname" class="input-box" id="FullName" placeholder="First name">
                            <span class="formerror"></span>
                        </div>
                    </div>
                    <div class="input">
                        <label for="Email" class="label">Email</label>
                        <div class="input_class" id="input_email">
                            <input type="email" class="input-box" id="Email" name="mail" placeholder="Your Email-ID" required>
                            <span class="formerror"></span>
                        </div>
                    </div>
                    <div class="input">
                        <label for="phone_number" class="label">Phone number</label>
                        <div class="input_class" id="input_phone">
                            <input type="tel" maxlength="10" pattern="[759][0-9]{9}" name="fphone" class="input-box" id="phone_number" placeholder="Enter your phone number">
                            <span class="formerror"></span>
                        </div>
                    </div>
                    <div class="input">
                        <label for="Date" class="label">Birth Date</label>
                        <div class="input_class" id="input_dob">
                            <input type="date" name="fdate" class="input-box" id="Date" placeholder="DOB" max="2021-12-31">
                            <span class="formerror"></span>
                        </div>
                    </div>
                    <div class="input">
                        <label for="Password" class="label">Password</label>
                        <div class="input_class" id="input_pass">
                            <input type="password" name="fpass" class="input-box" id="Password" placeholder="Enter password">
                            <span class="formerror"></span>
                        </div>
                    </div>
                    <div class="input">
                        <label for="confirmpassword" class="label">Confirm Password</label>
                        <div class="input_class" id="input_cpass">
                            <input type="password" name="fcpass" class="input-box" id="confirmpassword" placeholder="Confirm password">
                            <span class="formerror"></span>
                        </div>
                    </div>
                </div>

                <p class="term"><span><input type="checkbox" id="check" required></span> I agree to term services</p>
                <button type="submit" class="signup-btn">Sign Up</button>
                <hr>
                <p class="or">OR</p>
                <p class="log_in-main">If you have an account? <a href="login.html" class="log_in">Log In</a></p>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
